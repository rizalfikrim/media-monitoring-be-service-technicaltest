services:
  db:
    image: postgres:17-alpine
    container_name: media-monitoring-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: media_monitoring
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d media_monitoring"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
